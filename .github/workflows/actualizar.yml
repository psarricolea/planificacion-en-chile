name: Actualizar datos

on:
  schedule:
    - cron: "17 12 * * 1"   # lunes 12:17 UTC (09:17 en Chile continental, horario de verano)
  workflow_dispatch: {}      # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install --no-save --no-package-lock xlsx@0.18.5 papaparse@5.4.1
      - name: Descargar fuentes y registrar seguimiento
        run: node scripts/actualizar.mjs
      - name: Publicar cambios
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            msg=$(cat .resumen-actualizacion 2>/dev/null)
            git commit -m "${msg:-Actualización automática de datos}"
            git push
          fi
